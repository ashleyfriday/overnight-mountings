<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ring Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090a;--bg-2:#111113;--bg-3:#18181b;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.18);
  --ink:#f3f0ea;--soft:#a9a59d;--faint:#6f6c66;--gold:#e0bf7a;--gold-2:#c9a35c;--gold-ink:#1a150c;
  --serif:"Cormorant Garamond",Georgia,serif;--sans:"Jost",system-ui,sans-serif;--p:0;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:300 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100svh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
img{display:block;max-width:100%}
.num{font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:1px solid var(--gold);outline-offset:3px}

/* black silk backdrop */
.silk{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(60% 42% at 22% 18%,rgba(255,255,255,.07),transparent 70%),
  radial-gradient(48% 36% at 82% 30%,rgba(255,255,255,.05),transparent 70%),
  linear-gradient(118deg,transparent 30%,rgba(255,255,255,.035) 42%,transparent 52%,rgba(255,255,255,.03) 64%,transparent 74%),
  linear-gradient(64deg,transparent 46%,rgba(0,0,0,.5) 58%,transparent 70%),
  var(--bg)}

/* metal tint on the cut-out photos */
.y img{filter:sepia(.55) saturate(1.8) hue-rotate(-8deg) brightness(1.03)}
.r img{filter:sepia(.5) saturate(1.5) hue-rotate(-32deg) brightness(1.04)}
.p img{filter:contrast(1.06) brightness(.97)}

/* ---------- nav ---------- */
.nav{position:fixed;inset:0 0 auto;z-index:40;height:66px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 clamp(16px,3vw,40px)}
.nav .links{display:flex;gap:28px;font-size:13.5px;color:var(--soft)}
.nav .links button{color:inherit;font-size:inherit}
.nav .links button:hover,.nav .links button[aria-current="page"]{color:var(--ink)}
.logo{height:19px;filter:brightness(0) invert(.94)}
.nav .right{display:flex;justify-content:flex-end;align-items:center;gap:12px}
.saved-btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line-2);font-size:13px;color:var(--soft)}
.saved-btn:hover{color:var(--ink);border-color:rgba(255,255,255,.35)}
.saved-btn b{font-weight:500;color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:42px;padding:0 22px;border-radius:99px;font-size:14px;font-weight:400;white-space:nowrap;transition:transform .2s,background .2s,border-color .2s,color .2s}
.btn.gold{background:var(--gold);color:var(--gold-ink);font-weight:500}
.btn.gold:hover{background:#ebcd8d}
.btn.line{border:1px solid var(--line-2);color:var(--ink)}
.btn.line:hover{border-color:rgba(255,255,255,.4)}
.btn.sm{height:36px;padding:0 16px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- hero: your ring ---------- */
#hero{position:relative;z-index:1;pointer-events:none;height:100svh;min-height:680px;overflow-x:clip}
#hero .word{position:absolute;left:0;right:0;top:92px;text-align:center;font-family:var(--serif);font-weight:500;text-transform:uppercase;line-height:.9;white-space:nowrap;pointer-events:none;
  font-size:clamp(90px,17vw,270px);
  background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.02) 78%);-webkit-background-clip:text;background-clip:text;color:transparent}
.stage{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:170px;perspective:1200px}
.stage .glow{position:absolute;width:min(70vh,720px);aspect-ratio:1;border-radius:50%;background:radial-gradient(closest-side,rgba(255,250,240,.11),rgba(255,250,240,.03) 55%,transparent);top:50%;left:50%;transform:translate(-50%,-56%)}
.ring{position:relative;width:min(56vh,600px);transition:opacity .25s}
.ring img{width:100%;filter:drop-shadow(0 30px 40px rgba(0,0,0,.6));animation:float 7s ease-in-out infinite}
.ring.y img{filter:sepia(.55) saturate(1.8) hue-rotate(-8deg) brightness(1.03) drop-shadow(0 30px 40px rgba(0,0,0,.6))}
.ring.r img{filter:sepia(.5) saturate(1.5) hue-rotate(-32deg) brightness(1.04) drop-shadow(0 30px 40px rgba(0,0,0,.6))}
.ring.swap{opacity:0}
.stage.spinning .ring img{animation:spin 6s linear infinite}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes spin{from{transform:perspective(1100px) rotateY(0)}to{transform:perspective(1100px) rotateY(360deg)}}
.htxt{position:absolute;left:clamp(16px,4vw,56px);top:clamp(110px,16vh,150px);max-width:320px;pointer-events:auto}
.htxt .eb{font-size:12.5px;color:var(--soft);letter-spacing:.06em}
.htxt h1{margin:8px 0 6px;font:400 clamp(40px,4.4vw,60px)/1 var(--serif)}
.htxt h1 em{font-style:italic;color:var(--soft)}
.htxt .spec{color:var(--soft);font-size:14px}
.htxt .price{margin-top:18px;font-size:26px;font-weight:300}
.htxt .price small{font-size:12.5px;color:var(--faint);margin-left:8px}
.hact{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.ibtn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px;border-radius:99px;border:1px solid var(--line-2);font-size:13px;color:var(--soft);transition:.2s}
.ibtn:hover{color:var(--ink);border-color:rgba(255,255,255,.4)}
.ibtn[aria-pressed="true"]{color:var(--gold);border-color:rgba(224,191,122,.55)}
.ibtn[aria-pressed="true"] .ic{fill:currentColor}

/* stepper + control bar */
.dock{pointer-events:none;position:absolute;left:clamp(12px,3vw,40px);right:clamp(12px,3vw,40px);bottom:clamp(12px,3vh,28px);display:flex;flex-direction:column;align-items:center;gap:14px;z-index:2}
.bar{pointer-events:auto;position:relative;align-self:stretch;display:flex;align-items:stretch;gap:0;padding:14px 8px 14px 4px;border-radius:20px;border:1px solid var(--line);background:rgba(17,17,19,.62);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.bar .gs{display:flex;align-items:stretch;flex:1;min-width:0}
.bar .g{position:relative;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:0 clamp(12px,1.6vw,22px);border-left:1px solid var(--line);min-width:0}
.bar .g:first-child{border-left:0}
.bar .k{font-size:11.5px;color:var(--faint);letter-spacing:.04em;white-space:nowrap}
.bar .v{display:flex;align-items:center;gap:8px;min-height:30px;white-space:nowrap}
.bar .end{display:flex;align-items:center;gap:16px;padding-left:18px;border-left:1px solid var(--line);margin-left:auto}
.bar .tot{display:flex;flex-direction:column;align-items:flex-end}
.bar .tot b{font-size:21px;font-weight:300}
.drop{display:inline-flex;align-items:center;gap:8px;font-size:14px}
.drop .ic{width:14px;height:14px;color:var(--soft)}
.drop:hover{color:var(--gold)}
.sw{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);position:relative}
.sw[aria-pressed="true"]::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid var(--gold)}
.chip{height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line-2);font-size:13px;color:var(--soft)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.chip:disabled{opacity:.35;cursor:not-allowed}
.step-n{display:inline-flex;align-items:center;gap:12px}
.step-n button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--soft);font-size:16px;line-height:1}
.step-n button:hover{color:var(--ink);border-color:rgba(255,255,255,.4)}
.step-n output{min-width:62px;text-align:center}
.filters-btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line-2);font-size:13px}
.filters-btn:hover{border-color:var(--gold);color:var(--gold)}
.pop{position:absolute;bottom:calc(100% + 16px);left:8px;min-width:240px;padding:8px;border-radius:16px;border:1px solid var(--line);background:rgba(22,22,25,.96);backdrop-filter:blur(18px);box-shadow:0 20px 50px rgba(0,0,0,.5);display:none;z-index:5}
.pop.on{display:block;animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.pop button{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border-radius:10px;font-size:14px;color:var(--soft);text-align:left}
.pop button:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.pop button[aria-pressed="true"]{color:var(--gold)}
.pop button .ic{width:22px;height:22px;stroke-width:1}
.pop button small{margin-left:auto;color:var(--faint);font-size:12px}
.pop.grid2{display:none;grid-template-columns:1fr 1fr;min-width:400px}
.pop.grid2.on{display:grid}

/* step indicator */
.hstep{pointer-events:auto;display:flex;align-items:flex-start}
.hstep button{display:flex;flex-direction:column;align-items:center;gap:8px;width:110px;font-size:13px;color:var(--faint);position:relative}
.hstep button+button::before{content:"";position:absolute;top:15px;right:calc(50% + 22px);width:calc(100% - 44px);height:1px;background:var(--line-2)}
.hstep .dot{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:13px;color:var(--soft)}
.hstep button[aria-current="true"]{color:var(--ink)}
.hstep button[aria-current="true"] .dot{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hstep button:disabled{cursor:not-allowed}

.back{position:fixed;z-index:38;top:84px;left:clamp(16px,3vw,40px);display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 10px;border-radius:99px;font-size:13.5px;color:var(--soft);background:rgba(9,9,10,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:color .2s}
.back:hover{color:var(--ink)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
.scrim.on{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(860px,100%);max-height:min(86vh,900px);display:flex;flex-direction:column;border-radius:24px;border:1px solid var(--line);background:#121214;box-shadow:0 40px 90px rgba(0,0,0,.6);animation:rise .3s ease}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:22px 26px;border-bottom:1px solid var(--line)}
.sheet header h3{margin:0;font:400 28px/1.1 var(--serif)}
.sheet header small{display:block;color:var(--soft);font-size:13px;margin-top:4px}
.x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--soft)}
.x:hover{color:var(--ink)}
.sheet .body{overflow:auto;padding:8px 26px 26px}
.sheet footer{display:flex;align-items:center;gap:12px;padding:16px 26px;border-top:1px solid var(--line)}
.fs{padding:20px 0;border-bottom:1px solid var(--line)}
.fs:last-child{border-bottom:0}
.fs h4{margin:0 0 14px;font-size:13px;font-weight:400;color:var(--soft);display:flex;justify-content:space-between}
.fs h4 small{color:var(--faint)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:9px;min-height:38px;padding:6px 14px;border-radius:12px;border:1px solid var(--line-2);font-size:13.5px;color:var(--soft)}
.opt:hover{color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--gold);color:var(--ink);background:rgba(224,191,122,.06)}
.opt .ic{width:24px;height:24px;stroke-width:1}
.opt small{color:var(--faint);font-size:12px}
.opt.tall{flex-direction:column;justify-content:center;width:96px;height:86px;gap:6px}
.opt.tall .ic{width:30px;height:30px}
.field{height:42px;border-radius:12px;border:1px solid var(--line-2);background:transparent;padding:0 14px;min-width:120px}
.field option{background:#151517}
.engr{display:flex;align-items:center;gap:12px}
.engr input{flex:1;max-width:380px}
.engr small{color:var(--faint)}
.link{color:var(--gold);font-size:13px;border-bottom:1px solid rgba(224,191,122,.4)}
dl.sp{display:grid;grid-template-columns:auto 1fr;gap:12px 28px;margin:0}
dl.sp dt{color:var(--faint);font-size:13.5px}
dl.sp dd{margin:0}
.review{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(24px,4vw,64px);align-items:center;margin-top:36px}
.review .rimg{aspect-ratio:1;border-radius:24px;background:radial-gradient(70% 60% at 50% 45%,#202024,#111113 75%);border:1px solid var(--line);display:grid;place-items:center}
.review .rimg img{width:78%}
.totals{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.totals div{display:flex;justify-content:space-between}
.totals .big{font-size:26px;font-weight:300}
.toast{position:fixed;left:50%;bottom:clamp(110px,16vh,140px);transform:translateX(-50%);z-index:80;padding:11px 18px;border-radius:99px;background:#f3f0ea;color:#111;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.4)}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .bar{overflow-x:auto;scrollbar-width:none}
  .bar::-webkit-scrollbar{display:none}
}
@media (max-width:760px){
  .nav{grid-template-columns:auto 1fr}.nav .links{display:none}.nav .brand{order:-1}
  .nav .right .btn{display:none}
  .htxt{top:118px;max-width:none;right:16px}.htxt h1{font-size:38px}.htxt .price{margin-top:8px;font-size:21px}.hact{display:none}
  .stage{padding-bottom:230px}.ring{width:min(78vw,52vh)}
  .bar{flex-direction:column;gap:12px;padding:12px 0;overflow:visible}
  .bar .gs{overflow-x:auto;scrollbar-width:none;padding:0 4px}
  .bar .gs::-webkit-scrollbar{display:none}
  .bar .g{flex:none}
  .bar .end{margin:0;padding:12px 14px 0;border-left:0;border-top:1px solid var(--line);justify-content:space-between}
  .bar .tot{align-items:flex-start}
  .pop,.pop.grid2{position:fixed;left:8px;right:8px;bottom:calc(100% + 10px);min-width:0}
  .pop.grid2{min-width:280px;grid-template-columns:1fr}
  .back{top:72px}.hstep button{width:92px}
  .review{grid-template-columns:1fr}
  .sheet{max-height:92vh}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="has-ring">
<div class="silk" aria-hidden="true"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10m4 0h2M4 17h4m4 0h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
  <symbol id="i-spin" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v4h-4"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5m0-8.2v.2"/></symbol>
</svg>

<header class="nav">
  <nav class="links" aria-label="Main"><button aria-current="page">Settings</button><button data-info="The diamond step isn't on this page yet">Diamonds</button><button data-info="The review step isn't on this page yet">Review</button></nav>
  <span class="brand"><img class="logo" src="assets/overnight-logo.png" alt="Overnight"></span>
  <div class="right"><button class="saved-btn" data-saved><svg class="ic"><use href="#i-heart"/></svg>Saved <b id="savedN">0</b></button><button class="btn gold sm" data-info="Opens the existing appointment booking">Book an appointment</button></div>
</header>

<main>
  <!-- your ring -->
  <section id="hero" aria-label="Your ring">
    <div class="word" id="hWord" aria-hidden="true"></div>
    <div class="stage" id="stage"><div class="glow"></div><div class="ring" id="ring"></div></div>
    <div class="htxt" id="htxt"></div>
    <div class="dock">
      <nav class="hstep" aria-label="Steps">
        <button aria-current="true"><span class="dot">1</span>Setting</button>
        <button disabled><span class="dot">2</span>Diamond</button>
        <button disabled><span class="dot">3</span>Review</button>
      </nav>
      <div class="bar" id="bar"></div>
    </div>
  </section>
</main>

<button class="back" id="back"><svg class="ic"><use href="#i-back"/></svg>Back to listing</button>
<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- data ---------- */
const STYLES=[
 {id:"solitaire",name:"Solitaire",base:1150},{id:"hidden-halo",name:"Hidden Halo",base:1650},{id:"halo",name:"Halo",base:2100},
 {id:"pave",name:"Pavé",base:1800},{id:"three-stone",name:"Three Stone",base:2900},{id:"side-stone",name:"Side Stone",base:2300},
 {id:"channel",name:"Channel",base:2200},{id:"twist",name:"Twist",base:1700},{id:"nature-inspired",name:"Nature",base:1950},{id:"vintage",name:"Vintage",base:2400}
];
const NAMES=["Aurelia","Mira","Vela","Celeste","Lys","Nova","Elise","Seren","Isla","Orra","Etta","Juno","Cora","Wren","Esme","Thea","Margaux","Odile","Ines","Rhea"];
const TWEAK=["Classic","Petite","Cathedral","Low set","Bold","Tapered","Knife edge","Milgrain"];
const SETTINGS=[];STYLES.forEach((s,si)=>{for(let i=0;i<8;i++){const n=NAMES[(si*3+i*7)%NAMES.length];
  SETTINGS.push({id:`${s.id}-${i}`,style:s.id,name:n,tweak:TWEAK[(i+si)%TWEAK.length],base:Math.round(s.base*(.84+(i%5)*.09)/10)*10,no:String(51200+si*311+i*37)})}});
const METALS=[["w","White gold","radial-gradient(circle at 34% 30%,#fbfbfb,#d6d7d9 45%,#a9acb1)"],["y","Yellow gold","radial-gradient(circle at 34% 30%,#f3e2b3,#d6b46e 48%,#ad8644)"],["r","Rose gold","radial-gradient(circle at 34% 30%,#f7ddd0,#dfaa94 48%,#b97c68)"],["p","Platinum","radial-gradient(circle at 34% 30%,#f1f2f4,#c2c5ca 45%,#8f939a)"]];
const WIDTHS=[["1.5",-40],["2.0",0],["2.5",90],["3.0",180]];
const PRONGS=[["classic","Classic",0],["petite","Petite",0],["knife","Knife edge",40],["claw","Claw",60]];
const BANDS=[{id:"comfort",name:"Comfort fit",add:0},{id:"knife",name:"Knife edge",add:60},{id:"pave",name:"Micro pavé",add:420},{id:"split",name:"Split pavé",add:700},{id:"twist",name:"Twist",add:280}];
const PRICEB=[["any","Any price",0,1e9],["u1500","Under $1,500",0,1500],["15-25","$1,500 – $2,500",1500,2500],["25+","$2,500 and up",2500,1e9]];
const SICON={
  "solitaire":`<ellipse cx="12" cy="16" rx="7" ry="4.2"/><path d="M12 6.2 14.6 9 12 11.8 9.4 9Z"/>`,
  "hidden-halo":`<ellipse cx="12" cy="16" rx="7" ry="4.2"/><path d="M12 5.6 14.4 8.2 12 10.8 9.6 8.2Z"/><path d="M9.6 11.6q2.4 1.2 4.8 0"/>`,
  "halo":`<ellipse cx="12" cy="16" rx="7" ry="4.2"/><circle cx="12" cy="8.6" r="2"/><circle cx="12" cy="8.6" r="3.8" stroke-dasharray="1.2 1.2"/>`,
  "pave":`<ellipse cx="12" cy="16" rx="7" ry="4.2"/><path d="M12 6.2 14.6 9 12 11.8 9.4 9Z"/><path d="M5.6 14.6v.1M7.3 13.2v.1M16.7 13.2v.1M18.4 14.6v.1" stroke-width="1.8"/>`,
  "three-stone":`<ellipse cx="12" cy="16" rx="7" ry="4.2"/><circle cx="12" cy="8.8" r="2.4"/><circle cx="7.6" cy="10.4" r="1.5"/><circle cx="16.4" cy="10.4" r="1.5"/>`,
  "side-stone":`<ellipse cx="12" cy="16" rx="7" ry="4.2"/><path d="M12 6.2 14.6 9 12 11.8 9.4 9Z"/><path d="m6.8 11.8 1 1-1 1-1-1Zm10.4 0 1 1-1 1-1-1Z"/>`,
  "channel":`<ellipse cx="12" cy="16" rx="7" ry="4.2"/><ellipse cx="12" cy="16" rx="5.6" ry="3"/><path d="M12 6.2 14.6 9 12 11.8 9.4 9Z"/>`,
  "twist":`<path d="M5 16c2-4 5 2 7-2.2s5 1.8 7 2.2M5 16c1 3 5 4.2 7 4.2s6-1.2 7-4.2"/><path d="M12 5.6 14.4 8.2 12 10.8 9.6 8.2Z"/>`,
  "nature-inspired":`<ellipse cx="12" cy="16" rx="7" ry="4.2"/><path d="M12 6.2 14.6 9 12 11.8 9.4 9Z"/><path d="M15.5 11.2c1.8-.2 2.6-1.4 2.6-2.8-1.6 0-2.6.9-2.6 2.8Zm-7 0c-1.8-.2-2.6-1.4-2.6-2.8 1.6 0 2.6.9 2.6 2.8Z"/>`,
  "vintage":`<ellipse cx="12" cy="16" rx="7" ry="4.2"/><path d="M12 5.4 15 7.1v3.4L12 12.2 9 10.5V7.1Z"/><circle cx="12" cy="8.8" r="1.1"/>`
};

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const money=n=>"$"+Math.round(n).toLocaleString("en-US");
const ST=id=>STYLES.find(s=>s.id===id),SET=id=>SETTINGS.find(s=>s.id===id),BD=id=>BANDS.find(b=>b.id===id);
const img=s=>`assets/cut/${s.style}.png`;
const icon=(p,c="ic")=>`<svg class="${c}" viewBox="0 0 24 24">${p}</svg>`;
const use=(id,c="ic")=>`<svg class="${c}"><use href="#i-${id}"/></svg>`;
const mk=c=>c.metal==="p"?1.55:c.kt==="18"?1.22:1;
const metalName=(c=S)=>c.metal==="p"?"Platinum":`${c.kt}K ${METALS.find(m=>m[0]===c.metal)[1].replace(" gold"," Gold")}`;
const sPrice=(s,c=S)=>Math.round((s.base*mk(c)+BD(c.band).add+WIDTHS.find(w=>w[0]===c.width)[1]+PRONGS.find(p=>p[0]===c.prong)[2])/10)*10;
const fromPrice=s=>Math.round(s.base*mk(S)/10)*10;
const total=(c=S)=>c.setting?sPrice(SET(c.setting),c):0;
const fam=(c=S)=>c.metal==="w"?"":c.metal;
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2400)}
function prongSVG(k){
  const p={classic:[[8,9],[16,9],[8,16],[16,16]],petite:[[9,10],[15,10],[9,15],[15,15]],knife:[[12,6],[18,12],[12,18],[6,12]],claw:[[7,8],[17,8],[7,17],[17,17]]}[k];
  return `<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12.5" r="5.5"/>${p.map(([x,y])=>k==="claw"?`<path d="M${x} ${y} l${x<12?2:-2} ${y<12?2:-2}" stroke-width="1.6"/>`:`<circle cx="${x}" cy="${y}" r="${k==="petite"?.9:1.3}" fill="currentColor"/>`).join("")}</svg>`;
}

/* ---------- state ---------- */
const S={setting:"halo-0",metal:"w",kt:"14",band:"comfort",width:"2.0",prong:"classic",size:7,engr:"",
  spin:false,pop:null,modal:null,fPrice:"any",saved:[]};
const CFG=["setting","metal","kt","band","width","prong","size","engr"];
const snap=()=>Object.fromEntries(CFG.map(k=>[k,S[k]]));
const sameCfg=(a,b)=>CFG.every(k=>a[k]===b[k]);
const savedIdx=()=>S.saved.findIndex(c=>sameCfg(c,snap()));
const setList=(price=S.fPrice)=>{const [,,lo,hi]=PRICEB.find(p=>p[0]===price);return SETTINGS.filter(s=>fromPrice(s)>=lo&&fromPrice(s)<hi)};

/* ---------- hero ---------- */
let lastSrc="";
function renderHero(){
  const s=SET(S.setting),src=img(s),r=$("ring");
  const put=()=>{r.className="ring "+fam();r.innerHTML=`<img src="${src}" alt="The ${s.name}, ${ST(s.style).name} setting in ${metalName()}">`};
  if(lastSrc&&lastSrc!==src){r.classList.add("swap");setTimeout(put,220)}else put();
  lastSrc=src;
  $("hWord").textContent=ST(s.style).name;
  $("stage").classList.toggle("spinning",S.spin);
  $("htxt").innerHTML=`<div class="eb">Your ring · No. ${s.no}</div><h1><em>The</em> ${s.name}</h1>
    <div class="spec">${ST(s.style).name} · ${metalName()}</div>
    <div class="price num">${money(total())}<small>Setting only</small></div>
    <div class="hact"><button class="ibtn" data-save aria-pressed="${savedIdx()>-1}">${use("heart")}${savedIdx()>-1?"Saved":"Save"}</button><button class="ibtn" data-spin aria-pressed="${S.spin}">${use("spin")}360°</button><button class="ibtn" data-details>${use("info")}Details</button></div>`;
  $("savedN").textContent=S.saved.length;
}
function renderBar(){
  const s=SET(S.setting);
  const h=`<div class="g"><span class="k">Style</span><div class="v"><button class="drop" data-pop="style">${icon(SICON[s.style])}${ST(s.style).name}${use("chev")}</button></div>
        <div class="pop grid2${S.pop==="style"?" on":""}">${STYLES.map(x=>`<button data-swap="${x.id}" aria-pressed="${x.id===s.style}">${icon(SICON[x.id])}${x.name}</button>`).join("")}</div></div>
      <div class="g"><span class="k">Metal</span><div class="v">${METALS.map(([id,n,g])=>`<button class="sw" data-metal="${id}" aria-pressed="${S.metal===id}" aria-label="${n}" title="${n}" style="background:${g}"></button>`).join("")}</div></div>
      <div class="g"><span class="k">Purity</span><div class="v">${["14","18"].map(k=>`<button class="chip" data-kt="${k}" aria-pressed="${S.metal!=="p"&&S.kt===k}" ${S.metal==="p"?"disabled":""}>${k}K</button>`).join("")}</div></div>
      <div class="g"><span class="k">Band width</span><div class="v step-n"><button data-w="-1" aria-label="Narrower">−</button><output class="num">${S.width} mm</output><button data-w="1" aria-label="Wider">+</button></div></div>
      <div class="g"><span class="k">Budget</span><div class="v"><button class="drop" data-pop="price">${PRICEB.find(p=>p[0]===S.fPrice)[1]}${use("chev")}</button></div>
        <div class="pop${S.pop==="price"?" on":""}">${PRICEB.map(([id,t])=>`<button data-fprice="${id}" aria-pressed="${S.fPrice===id}">${t}<small>${setList(id).length}</small></button>`).join("")}</div></div>
      <div class="g"><div class="v"><button class="filters-btn" data-modal="filters">${use("sliders")}More options</button></div></div>`;
  $("bar").innerHTML=`<div class="gs">${h}</div><div class="end"><div class="tot"><span class="k">Total</span><b class="num">${money(total())}</b></div><button class="btn gold" data-info="The diamond step isn't on this page yet">Choose diamond${use("arrow")}</button></div>`;
}

/* ---------- modal ---------- */
function openModal(m){S.modal=m;renderModal();$("scrim").classList.add("on");document.body.style.overflow="hidden"}
function closeModal(){S.modal=null;$("scrim").classList.remove("on");document.body.style.overflow=""}
function renderModal(){
  const sh=$("sheet");
  if(S.modal==="filters"){
    sh.innerHTML=`<header><div><h3>More options</h3><small>Fine-tune your ring.</small></div><button class="x" data-close aria-label="Close">${use("x")}</button></header>
     <div class="body">
      <div class="fs"><h4>Metal</h4><div class="opts">${METALS.map(([id,t,g])=>`<button class="opt" data-metal="${id}" aria-pressed="${S.metal===id}"><span class="sw" style="background:${g};width:18px;height:18px"></span>${t}</button>`).join("")}${["14","18"].map(k=>`<button class="opt" data-kt="${k}" aria-pressed="${S.metal!=="p"&&S.kt===k}" ${S.metal==="p"?"disabled":""}>${k}K</button>`).join("")}</div></div>
      <div class="fs"><h4>Band</h4><div class="opts">${BANDS.map(b=>`<button class="opt" data-band="${b.id}" aria-pressed="${S.band===b.id}">${b.name}<small>${b.add?"+"+money(b.add):"Included"}</small></button>`).join("")}</div></div>
      <div class="fs"><h4>Band width</h4><div class="opts">${WIDTHS.map(([w,a])=>`<button class="opt" data-width="${w}" aria-pressed="${S.width===w}">${w} mm${a>0?`<small>+${money(a)}</small>`:""}</button>`).join("")}</div></div>
      <div class="fs"><h4>Prong style</h4><div class="opts">${PRONGS.map(([k,t])=>`<button class="opt tall" data-prong="${k}" aria-pressed="${S.prong===k}">${prongSVG(k)}${t}</button>`).join("")}</div></div>
      <div class="fs"><h4>Ring size</h4><select class="field" id="size" aria-label="Ring size">${Array.from({length:29},(_,i)=>3+i*.25).map(v=>`<option value="${v}" ${S.size===v?"selected":""}>${v}</option>`).join("")}</select></div>
      <div class="fs"><h4>Engraving <small>Optional</small></h4><div class="engr"><input class="field" id="engr" maxlength="30" placeholder="Forever yours" value="${S.engr.replace(/"/g,"&quot;")}" aria-label="Engraving"><small id="engrN">${S.engr.length}/30</small></div></div>
     </div>
     <footer style="justify-content:flex-end"><button class="btn gold" data-close>Done</button></footer>`;
    $("size").onchange=e=>{S.size=+e.target.value;refresh()};
    $("engr").oninput=e=>{S.engr=e.target.value;$("engrN").textContent=S.engr.length+"/30"};
  }else if(S.modal==="details"){
    const s=SET(S.setting);
    sh.innerHTML=`<header><div><h3>The ${s.name}</h3><small>${ST(s.style).name} · No. ${s.no}</small></div><button class="x" data-close aria-label="Close">${use("x")}</button></header>
     <div class="body"><div class="review" style="margin-top:14px"><div class="rimg ${fam()}"><img src="${img(s)}" alt=""></div><div>
      <p style="margin:0 0 20px;color:var(--soft)">A ${ST(s.style).name.toLowerCase()} setting in ${metalName().toLowerCase()} on a ${BD(S.band).name.toLowerCase()} band. Made to order by Overnight.</p>
      <dl class="sp"><dt>Metal</dt><dd>${metalName()}</dd><dt>Rhodium plated</dt><dd>${S.metal==="w"?"Yes":"No"}</dd><dt>Band</dt><dd>${BD(S.band).name} · ${S.width} mm</dd><dt>Prongs</dt><dd>${PRONGS.find(p=>p[0]===S.prong)[1]}</dd><dt>Ring size</dt><dd>${S.size} · resizable 3 – 10</dd><dt>Setting</dt><dd class="num">${money(sPrice(s))}</dd></dl>
      <div class="totals"><div class="big"><span>Total</span><span class="num">${money(total())}</span></div></div></div></div></div>`;
  }
}

/* ---------- orchestration ---------- */
function refresh(){renderHero();renderBar();if(S.modal)renderModal()}
function toggleSave(){
  const i=savedIdx();
  if(i>-1){S.saved.splice(i,1);toast("Removed from your saved rings")}
  else if(S.saved.length>=5)toast("You can save up to five rings. Remove one to add another.");
  else{S.saved.push(snap());toast(`Saved · ${S.saved.length} of 5`)}
  refresh();
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");
  const d=b?b.dataset:{};
  if(b&&b.id==="back"){history.back();return}
  if(d.pop){S.pop=S.pop===d.pop?null:d.pop;renderBar();return}
  if(S.pop&&!e.target.closest(".pop")){S.pop=null;renderBar()}
  if(!b)return;
  if(d.close!==undefined){closeModal();return}
  if(d.info){toast(d.info);return}
  if(d.saved!==undefined){toast(`${S.saved.length} of 5 saved rings`);return}
  if(d.swap){const idx=+S.setting.split("-").pop();S.setting=`${d.swap}-${idx}`;S.pop=null;refresh();return}
  if(d.fprice){S.fPrice=d.fprice;S.pop=null;renderBar();return}
  if(d.metal){S.metal=d.metal;refresh();return}
  if(d.kt){S.kt=d.kt;refresh();return}
  if(d.band){S.band=d.band;refresh();return}
  if(d.width){S.width=d.width;refresh();return}
  if(d.w){const i=WIDTHS.findIndex(w=>w[0]===S.width)+ +d.w;if(WIDTHS[i]){S.width=WIDTHS[i][0];refresh()}return}
  if(d.prong){S.prong=d.prong;refresh();return}
  if(d.spin!==undefined){S.spin=!S.spin;renderHero();return}
  if(d.save!==undefined){toggleSave();return}
  if(d.details!==undefined){openModal("details");return}
  if(d.modal){S.pop=null;renderBar();openModal(d.modal);return}
});
$("scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(S.modal)closeModal();else if(S.pop){S.pop=null;renderBar()}}});

refresh();
</script>

</script>
